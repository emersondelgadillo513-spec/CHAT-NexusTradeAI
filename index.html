<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat del Grupo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #0d0f14;
    --surface: #161820;
    --surface2: #1e2028;
    --border: rgba(255,255,255,0.07);
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #f0f0f5;
    --muted: #6b6d7a;
    --bubble-me: linear-gradient(135deg, #6c63ff, #5a52e0);
    --bubble-other: #1e2028;
    --online: #22c55e;
    --radius: 18px;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── PANTALLA NOMBRE ── */
  #screen-name {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  .name-card {
    width: 100%; max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 28px;
    text-align: center;
    animation: slideUp 0.5s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes slideUp {
    from { opacity:0; transform:translateY(30px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .name-avatar-big {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; margin: 0 auto 20px;
    box-shadow: 0 0 40px rgba(108,99,255,0.35);
  }

  .name-card h2 {
    font-size: 22px; font-weight: 800; margin-bottom: 6px;
  }

  .name-card p {
    font-size: 13px; color: var(--muted); margin-bottom: 28px; line-height: 1.5;
  }

  .name-input {
    width: 100%;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; font-weight: 600;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 14px;
    text-align: center;
  }

  .name-input:focus { border-color: var(--accent); }
  .name-input::placeholder { color: var(--muted); font-weight: 400; }

  .name-btn {
    width: 100%;
    background: var(--accent);
    border: none; border-radius: 14px;
    padding: 14px;
    color: #fff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .name-btn:hover { background: #5a52e0; transform: translateY(-1px); }
  .name-btn:active { transform: translateY(0); }

  /* ── HEADER ── */
  .chat-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }

  .header-icon {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }

  .header-info { flex: 1; }
  .header-name { font-size: 16px; font-weight: 800; }
  .header-members { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .online-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--online); margin-right:4px; }

  .header-my-name {
    font-size: 11px; color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 10px;
    max-width: 100px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ── MESSAGES ── */
  #messages-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex; flex-direction: column; gap: 6px;
    scroll-behavior: smooth;
  }

  #messages-wrap::-webkit-scrollbar { width: 3px; }
  #messages-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Date divider */
  .date-divider {
    text-align: center;
    font-size: 11px; color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    margin: 8px auto;
    display: table;
  }

  /* Message row */
  .msg-row {
    display: flex; align-items: flex-end; gap: 8px;
    animation: msgIn 0.25s ease-out both;
  }

  @keyframes msgIn {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .msg-row.me { flex-direction: row-reverse; }

  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    color: #fff;
  }

  .msg-bubble-wrap { max-width: 72%; display: flex; flex-direction: column; }
  .msg-row.me .msg-bubble-wrap { align-items: flex-end; }

  .msg-sender {
    font-size: 10px; font-weight: 700;
    color: var(--accent);
    margin-bottom: 3px;
    padding: 0 4px;
  }

  .msg-row.me .msg-sender { display: none; }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px; line-height: 1.5;
    word-break: break-word;
    position: relative;
  }

  .msg-row.me .msg-bubble {
    background: var(--bubble-me);
    border-bottom-right-radius: 4px;
    color: #fff;
  }

  .msg-row:not(.me) .msg-bubble {
    background: var(--bubble-other);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg-bubble img {
    max-width: 100%; max-height: 220px;
    border-radius: 10px; display: block;
    cursor: pointer;
  }

  .msg-time {
    font-size: 10px; color: var(--muted);
    padding: 2px 4px; margin-top: 2px;
  }

  /* ── INPUT BAR ── */
  .chat-input-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    display: flex; align-items: flex-end; gap: 10px;
    flex-shrink: 0;
  }

  .input-wrap {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within { border-color: rgba(108,99,255,0.5); }

  #msg-input {
    flex: 1;
    background: none; border: none; outline: none;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px; line-height: 1.5;
    resize: none;
    max-height: 100px;
    overflow-y: auto;
  }

  #msg-input::placeholder { color: var(--muted); }

  .btn-icon {
    width: 36px; height: 36px; border-radius: 50%;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    font-size: 18px;
  }

  .btn-photo {
    background: var(--surface2);
    color: var(--muted);
  }

  .btn-photo:hover { color: var(--text); }

  .btn-send {
    background: var(--accent);
    color: #fff;
  }

  .btn-send:hover { background: #5a52e0; transform: scale(1.05); }
  .btn-send:active { transform: scale(0.97); }
  .btn-send:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; transform: none; }

  #file-input { display: none; }

  /* ── MODERATION OVERLAY ── */
  #mod-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 400;
    background: rgba(0,0,0,0.85);
    align-items: center; justify-content: center;
    padding: 24px;
  }
  #mod-overlay.open { display: flex; }
  .mod-card {
    background: var(--surface);
    border: 1px solid rgba(239,68,68,0.4);
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 340px; width: 100%;
    text-align: center;
    animation: slideUp 0.3s cubic-bezier(.16,1,.3,1) both;
  }
  .mod-icon { font-size: 44px; margin-bottom: 14px; }
  .mod-title { font-size: 18px; font-weight: 800; color: #ef4444; margin-bottom: 8px; }
  .mod-desc { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
  .mod-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 24px;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mod-btn:hover { background: var(--accent); border-color: var(--accent); }
  .uploading-bubble {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
    padding: 10px 14px;
    background: var(--bubble-other);
    border: 1px solid var(--border);
    border-radius: 18px;
  }
  .spin {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── IMAGE LIGHTBOX ── */
  #lightbox {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.9);
    align-items: center; justify-content: center;
    cursor: zoom-out;
  }

  #lightbox.open { display: flex; }
  #lightbox img { max-width: 95%; max-height: 90dvh; border-radius: 12px; }

  /* ── TYPING ── */
  .typing-indicator {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    font-size: 12px; color: var(--muted);
    min-height: 28px;
  }

  .typing-dots span {
    display: inline-block; width: 5px; height: 5px;
    border-radius: 50%; background: var(--muted);
    animation: bounce 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }

  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: rgba(30,32,40,0.95);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 13px; color: var(--text);
    z-index: 300;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
    white-space: nowrap;
  }

  #toast.show { opacity: 1; }

  /* ── AVATAR COLORS ── */
  .color-0 { background: #6c63ff; }
  .color-1 { background: #ff6584; }
  .color-2 { background: #43b89c; }
  .color-3 { background: #f59e0b; }
  .color-4 { background: #3b82f6; }
  .color-5 { background: #ec4899; }
  .color-6 { background: #10b981; }
  .color-7 { background: #f97316; }

  /* Empty state */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); text-align: center; padding: 40px;
    gap: 10px;
  }

  .empty-state .emoji { font-size: 48px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<!-- PANTALLA: Ingresar nombre -->
<div id="screen-name">
  <div class="name-card">
    <div class="name-avatar-big">💬</div>
    <h2>¡Bienvenido al Grupo!</h2>
    <p>Ingresa tu nombre para unirte al chat.<br>Solo se pedirá una vez.</p>
    <input type="text" class="name-input" id="input-nombre"
      placeholder="Tu nombre o apodo"
      maxlength="24"
      onkeydown="if(event.key==='Enter')entrarChat()" />
    <button class="name-btn" onclick="entrarChat()">Entrar al Chat →</button>
  </div>
</div>

<!-- CHAT -->
<div class="chat-header">
  <div class="header-icon">💬</div>
  <div class="header-info">
    <div class="header-name">Grupo de Discusión</div>
    <div class="header-members"><span class="online-dot"></span><span id="members-count">0 en línea</span></div>
  </div>
  <div class="header-my-name" id="header-my-name"></div>
</div>

<div id="messages-wrap">
  <div class="empty-state" id="empty-state">
    <div class="emoji">👋</div>
    <p>Sé el primero en escribir.<br>¡El grupo está esperando!</p>
  </div>
</div>

<div class="typing-indicator" id="typing-bar"></div>

<div class="chat-input-bar">
  <div class="input-wrap">
    <textarea id="msg-input" placeholder="Escribe un mensaje..." rows="1"
      oninput="autoResize(this);manejarTyping()"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarMensaje();}"></textarea>
    <label for="file-input" class="btn-icon btn-photo" title="Enviar foto">📷</label>
    <input type="file" id="file-input" accept="image/*" onchange="enviarFoto(this)">
  </div>
  <button class="btn-icon btn-send" id="btn-send" onclick="enviarMensaje()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<!-- Lightbox fotos -->
<div id="lightbox" onclick="this.classList.remove('open')">
  <img id="lightbox-img" src="" alt="foto">
</div>

<!-- Moderacion -->
<div id="mod-overlay" style="display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;padding:24px;">
  <div class="mod-card">
    <div class="mod-icon">🚫</div>
    <div class="mod-title">Contenido no permitido</div>
    <div class="mod-desc" id="mod-desc">Esta imagen fue bloqueada por nuestro sistema de moderación. Mantén el grupo respetuoso.</div>
    <button class="mod-btn" onclick="document.getElementById('mod-overlay').style.display='none'">Entendido</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ============================================================
//  🔧 CONFIGURACIÓN FIREBASE — reemplaza con la tuya
// ============================================================
var firebaseConfig = {
  apiKey: "AIzaSyCerCvrY51UT91YzteMcB9ZriI8NYpHAjU",
  authDomain: "chat-trading-grupo.firebaseapp.com",
  databaseURL: "https://chat-trading-grupo-default-rtdb.firebaseio.com",
  projectId: "chat-trading-grupo",
  storageBucket: "chat-trading-grupo.firebasestorage.app",
  messagingSenderId: "301751640334",
  appId: "1:301751640334:web:6feab586c429982cd0775f"
};
// ============================================================

var db = null;
var firebaseReady = false;
var myName = '';
var myColor = 0;
var typingTimer = null;
var lastDate = '';
var membersRef = null;
var myPresenceKey = null;

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  firebaseReady = true;
} catch(e) {
  console.warn('Firebase no configurado, modo demo local:', e);
}

// ── NOMBRE ──────────────────────────────────────────────────
function entrarChat() {
  var n = document.getElementById('input-nombre').value.trim();
  if (!n || n.length < 2) { showToast('Ingresa al menos 2 caracteres'); return; }
  myName = n;
  myColor = strToColor(n);
  try {
    localStorage.setItem('chat_nombre', n);
    localStorage.setItem('chat_color', myColor);
  } catch(e) {}
  document.getElementById('header-my-name').textContent = '👤 ' + n;
  document.getElementById('screen-name').style.display = 'none';
  iniciarChat();
}

function strToColor(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 8;
  return h;
}

// ── INIT ────────────────────────────────────────────────────
window.onload = function() {
  var saved = null;
  try { saved = localStorage.getItem('chat_nombre'); } catch(e) {}
  if (saved && saved.trim().length >= 2) {
    myName = saved.trim();
    try { myColor = parseInt(localStorage.getItem('chat_color')) || strToColor(myName); } catch(e) { myColor = strToColor(myName); }
    document.getElementById('header-my-name').textContent = '👤 ' + myName;
    document.getElementById('screen-name').style.display = 'none';
    iniciarChat();
  } else {
    setTimeout(function() {
      document.getElementById('input-nombre').focus();
    }, 300);
  }
};

function iniciarChat() {
  if (!firebaseReady || !db) {
    showToast('⚠️ Configura Firebase para el chat en tiempo real');
    return;
  }

  // ── LIMPIEZA SEMANAL ─────────────────────────────────────
  limpiarMensajesViejos();

  // Escuchar mensajes
  db.ref('chat/mensajes').limitToLast(100).on('child_added', function(snap) {
    var m = snap.val();
    if (m) renderMensaje(m, snap.key);
  });

  // Presencia — quiénes están en línea
  membersRef = db.ref('chat/presencia/' + safeKey(myName));
  membersRef.set({ nombre: myName, ts: Date.now() });
  membersRef.onDisconnect().remove();

  db.ref('chat/presencia').on('value', function(snap) {
    var n = snap.numChildren ? snap.numChildren() : Object.keys(snap.val() || {}).length;
    document.getElementById('members-count').textContent = n + ' en línea';
  });

  // Escuchar quién está escribiendo
  db.ref('chat/typing').on('value', function(snap) {
    var datos = snap.val() || {};
    var otros = Object.values(datos).filter(function(d) {
      return d.nombre !== myName && Date.now() - (d.ts || 0) < 4000;
    });
    var bar = document.getElementById('typing-bar');
    if (otros.length === 0) {
      bar.innerHTML = '';
    } else {
      var nombres = otros.map(function(d){ return d.nombre; }).join(', ');
      bar.innerHTML = '<span>' + nombres + ' está escribiendo...</span><span class="typing-dots"><span></span><span></span><span></span></span>';
    }
  });
}

function safeKey(s) {
  return s.replace(/[.#$\[\]\/]/g, '_');
}

// ── ENVIAR MENSAJE CON FILTRO ───────────────────────────────
var PALABRAS_PROHIBIDAS = [
  'porno','pornografia','xxx','sexo explicito','desnudo','nudes','nude',
  'puta','puto','mierda','verga','pene','vagina','culo','chinga',
  'drogas','cocaina','marihuana ilegal','matar','asesinar','terrorismo'
];

function textoTienePalabraProhibida(texto) {
  var t = texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return PALABRAS_PROHIBIDAS.some(function(p) { return t.indexOf(p) !== -1; });
}

function enviarMensaje() {
  var inp = document.getElementById('msg-input');
  var texto = inp.value.trim();
  if (!texto) return;
  if (!firebaseReady || !db) { showToast('Firebase no configurado'); return; }

  if (textoTienePalabraProhibida(texto)) {
    document.getElementById('mod-desc').textContent = 'Tu mensaje contiene palabras o contenido no permitido en este grupo. Por favor mantén un lenguaje respetuoso.';
    document.getElementById('mod-overlay').style.display = 'flex';
    return;
  }

  var msg = {
    tipo: 'texto',
    texto: texto,
    nombre: myName,
    color: myColor,
    ts: Date.now()
  };

  db.ref('chat/mensajes').push(msg);
  db.ref('chat/typing/' + safeKey(myName)).remove();
  inp.value = '';
  inp.style.height = 'auto';
}

// ── ENVIAR FOTO CON MODERACIÓN IA ──────────────────────────
function enviarFoto(input) {
  var file = input.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) { showToast('Imagen muy grande (máx 3MB)'); input.value=''; return; }

  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      // Comprimir
      var canvas = document.createElement('canvas');
      var max = 800;
      var w = img.width, h = img.height;
      if (w > max) { h = h * max / w; w = max; }
      if (h > max) { w = w * max / h; h = max; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var data64 = canvas.toDataURL('image/jpeg', 0.7);

      // Mostrar burbuja de "analizando..."
      var wrap = document.getElementById('messages-wrap');
      var loadRow = document.createElement('div');
      loadRow.className = 'msg-row me';
      loadRow.id = 'uploading-row';
      loadRow.innerHTML =
        '<div class="msg-avatar color-' + myColor + '">' + myName.charAt(0).toUpperCase() + '</div>' +
        '<div class="msg-bubble-wrap" style="align-items:flex-end">' +
          '<div class="uploading-bubble"><div class="spin"></div> Verificando imagen...</div>' +
        '</div>';
      wrap.appendChild(loadRow);
      wrap.scrollTop = wrap.scrollHeight;

      // Llamar a Claude API para moderar
      moderarImagen(data64).then(function(resultado) {
        // Quitar burbuja de carga
        var r = document.getElementById('uploading-row');
        if (r) r.remove();

        if (resultado.permitida) {
          // ✅ Imagen aprobada — publicar
          var msg = { tipo: 'foto', foto: data64, nombre: myName, color: myColor, ts: Date.now() };
          if (firebaseReady && db) db.ref('chat/mensajes').push(msg);
        } else {
          // 🚫 Imagen bloqueada
          document.getElementById('mod-desc').textContent = resultado.razon || 'Contenido no permitido en este grupo.';
          document.getElementById('mod-overlay').style.display = 'flex';
          // Registrar intento en Firebase (opcional, para admin)
          if (firebaseReady && db) {
            db.ref('chat/moderacion').push({ nombre: myName, ts: Date.now(), razon: resultado.razon });
          }
        }
      }).catch(function(err) {
        var r = document.getElementById('uploading-row');
        if (r) r.remove();
        showToast('Error al verificar imagen, intenta de nuevo');
        console.error(err);
      });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

// ── MODERACIÓN CON CLAUDE API ────────────────────────────────
async function moderarImagen(base64) {
  // Extraer solo el dato base64 sin el prefijo data:image/...
  var b64data = base64.split(',')[1];

  var response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 200,
      system: 'Eres un moderador de contenido para un chat grupal. Analiza la imagen y responde SOLO con JSON válido sin ningún texto adicional, sin markdown, sin explicaciones. El formato exacto debe ser: {"permitida": true} o {"permitida": false, "razon": "motivo breve en español"}. Bloquea: pornografía, desnudos, contenido sexual explícito o sugerente, violencia gráfica, contenido para adultos, imágenes ofensivas o de odio, drogas usadas ilegalmente, armas apuntando a personas. Permite: fotos normales, capturas de pantalla, memes, paisajes, personas vestidas, comida, animales, texto, documentos.',
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64data } },
          { type: 'text', text: '¿Esta imagen es apropiada para un grupo de chat familiar/laboral?' }
        ]
      }]
    })
  });

  var data = await response.json();
  var texto = (data.content && data.content[0] && data.content[0].text) || '{"permitida": true}';

  // Limpiar posibles markdown fences
  texto = texto.replace(/```json|```/g, '').trim();

  try {
    return JSON.parse(texto);
  } catch(e) {
    // Si no parsea bien, permitir por defecto
    return { permitida: true };
  }
}

// ── RENDER MENSAJE ──────────────────────────────────────────
var renderedKeys = {};

function renderMensaje(m, key) {
  if (renderedKeys[key]) return;
  renderedKeys[key] = true;

  var wrap = document.getElementById('messages-wrap');
  var empty = document.getElementById('empty-state');
  if (empty) empty.remove();

  // Separador de fecha
  var fecha = formatFecha(m.ts);
  if (fecha !== lastDate) {
    lastDate = fecha;
    var div = document.createElement('div');
    div.className = 'date-divider';
    div.textContent = fecha;
    wrap.appendChild(div);
  }

  // Mensaje del sistema (limpieza semanal)
  if (m.tipo === 'sistema') {
    var sysDiv = document.createElement('div');
    sysDiv.className = 'date-divider';
    sysDiv.style.cssText = 'background:rgba(108,99,255,0.15);border-color:rgba(108,99,255,0.3);color:#a5a0ff;max-width:90%;';
    sysDiv.textContent = m.texto;
    wrap.appendChild(sysDiv);
    wrap.scrollTop = wrap.scrollHeight;
    return;
  }

  var esMio = m.nombre === myName;
  var row = document.createElement('div');
  row.className = 'msg-row' + (esMio ? ' me' : '');

  var initial = (m.nombre || '?').charAt(0).toUpperCase();
  var colorClass = 'color-' + (m.color !== undefined ? m.color : strToColor(m.nombre || ''));

  var contenidoBurbuja = '';
  if (m.tipo === 'foto' && m.foto) {
    contenidoBurbuja = '<img src="' + m.foto + '" onclick="abrirLightbox(this.src)" loading="lazy">';
  } else {
    contenidoBurbuja = escapeHtml(m.texto || '');
  }

  row.innerHTML =
    '<div class="msg-avatar ' + colorClass + '">' + initial + '</div>' +
    '<div class="msg-bubble-wrap">' +
      (esMio ? '' : '<div class="msg-sender">' + escapeHtml(m.nombre || '') + '</div>') +
      '<div class="msg-bubble">' + contenidoBurbuja + '</div>' +
      '<div class="msg-time">' + formatHora(m.ts) + '</div>' +
    '</div>';

  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function formatHora(ts) {
  var d = new Date(ts);
  return d.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
}

function formatFecha(ts) {
  var d = new Date(ts);
  var hoy = new Date();
  if (d.toDateString() === hoy.toDateString()) return 'Hoy';
  var ayer = new Date(hoy); ayer.setDate(hoy.getDate()-1);
  if (d.toDateString() === ayer.toDateString()) return 'Ayer';
  return d.toLocaleDateString('es-PE', { day:'2-digit', month:'long' });
}

// ── TYPING ──────────────────────────────────────────────────
function manejarTyping() {
  if (!firebaseReady || !db) return;
  db.ref('chat/typing/' + safeKey(myName)).set({ nombre: myName, ts: Date.now() });
  clearTimeout(typingTimer);
  typingTimer = setTimeout(function() {
    db.ref('chat/typing/' + safeKey(myName)).remove();
  }, 3000);
}

// ── AUTO RESIZE TEXTAREA ─────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ── LIGHTBOX ────────────────────────────────────────────────
function abrirLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}

// ── LIMPIEZA SEMANAL ────────────────────────────────────────
function limpiarMensajesViejos() {
  var UNA_SEMANA = 7 * 24 * 60 * 60 * 1000; // 7 días en ms
  var corte = Date.now() - UNA_SEMANA;

  // Solo el primer usuario que abra el chat ese día ejecuta la limpieza
  // Se guarda en Firebase la última vez que se limpió
  db.ref('chat/ultima_limpieza').once('value').then(function(snap) {
    var ultima = snap.val() || 0;
    var UN_DIA = 24 * 60 * 60 * 1000;

    // Si ya se limpió hace menos de 24h, no volver a limpiar
    if (Date.now() - ultima < UN_DIA) return;

    // Marcar que se está limpiando ahora
    db.ref('chat/ultima_limpieza').set(Date.now());

    // Buscar mensajes con más de 7 días y eliminarlos
    db.ref('chat/mensajes').orderByChild('ts').endAt(corte).once('value').then(function(snap) {
      if (!snap.exists()) return;
      var updates = {};
      var count = 0;
      snap.forEach(function(child) {
        updates['chat/mensajes/' + child.key] = null;
        count++;
      });
      if (count > 0) {
        db.ref().update(updates).then(function() {
          console.log('🧹 Limpieza semanal: ' + count + ' mensajes eliminados');
          // Aviso en chat que empezó nueva semana
          if (count > 5) { // Solo avisar si había mensajes de verdad
            setTimeout(function() {
              db.ref('chat/mensajes').push({
                tipo: 'sistema',
                texto: '🔄 Nueva semana — El historial anterior fue eliminado automáticamente. ¡A chatear de nuevo!',
                nombre: 'Sistema',
                color: -1,
                ts: Date.now()
              });
            }, 1000);
          }
        });
      }
    });
  });
}

// ── TOAST ───────────────────────────────────────────────────
var toastTimer;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3000);
}
</script>
